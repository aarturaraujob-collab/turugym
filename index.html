<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TURUGYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F7;--card:#FFFFFF;--ink:#0F1E26;--muted:#566A74;--line:#D3E0E6;
  --pri:#B5E425;--pri-ink:#0F1E26;--pri-text:#4A7600;--soft:#EAF6C9;--amber:#2A7FA0;--amber-soft:#DCEFF6;--frost:#A6E1F1;--z1:#8197A2;--danger:#B3412E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1319;--card:#111E26;--ink:#E6F1F5;--muted:#8BA2AD;--line:#1E3240;
    --pri:#C6F135;--pri-ink:#0A1319;--pri-text:#C6F135;--soft:#1E3118;--amber:#74D0EA;--amber-soft:#12303D;--frost:#74D0EA;--z1:#5F7782;--danger:#E06A55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1319;--card:#111E26;--ink:#E6F1F5;--muted:#8BA2AD;--line:#1E3240;
    --pri:#C6F135;--pri-ink:#0A1319;--pri-text:#C6F135;--soft:#1E3118;--amber:#74D0EA;--amber-soft:#12303D;--frost:#74D0EA;--z1:#5F7782;--danger:#E06A55;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Saira",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.big{font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1,h2{font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.top .sub{text-transform:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri-text);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px 10px;max-width:600px;margin:0 auto}
.top h1{font-size:28px;line-height:1.1;flex:1}
.top .sub{display:block;font-family:"Saira",sans-serif;font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0}
.back{border:0;background:var(--card);width:40px;height:40px;border-radius:12px;font-size:22px;line-height:1;flex:none}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
main{max-width:600px;margin:0 auto;padding:4px 16px 150px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 18px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 0 6px;text-align:center}
.day b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.day span{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:17px}
.day.today{border-color:var(--pri-text);box-shadow:inset 0 0 0 1px var(--pri-text)}
.day.done{background:var(--soft)}
.day.done span::after{content:" ✓";color:var(--pri-text);font-size:14px}
.today-card{background:var(--pri);color:var(--pri-ink);border-radius:20px;padding:18px;margin-bottom:22px}
.today-card p{margin:0 0 12px;opacity:.85;font-size:15px}
.today-card .go{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--pri-ink);color:var(--pri);border:0;border-radius:14px;padding:14px 16px;margin-top:8px;text-align:left}
.today-card .go strong{font-family:"Saira Condensed",sans-serif;font-size:22px;display:block}
.today-card .go small{font-size:14px;opacity:.8}
.today-card .go.ok{opacity:.7}
.section-title{font-size:20px;margin:6px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.item .letter{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--pri-text);display:grid;place-items:center;font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:20px;flex:none}
.item .letter.run{background:var(--amber-soft);color:var(--amber);font-size:15px}
.item div{flex:1;min-width:0}
.item strong{display:block;font-weight:600}
.item small{color:var(--muted);font-size:14px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;margin:0 0 14px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px 8px;margin-bottom:12px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px}
.ex-head h3{font-size:21px;line-height:1.15}
.ex-head .meta{color:var(--muted);font-size:14px;white-space:nowrap}
.tag{color:var(--amber);font-size:14px;margin:2px 2px 6px;font-weight:500}
.grid{display:grid;grid-template-columns:34px 1fr 72px 72px 48px;gap:6px;align-items:center;margin-top:8px}
.grid.nokg{grid-template-columns:34px 1fr 72px 48px}
.grid.time{grid-template-columns:34px 1fr 48px}
.gh{font-size:12px;color:var(--muted);text-align:center}
.gh.l{text-align:left}
.n{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.prev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:600 18px "Saira",sans-serif;-moz-appearance:textfield}
.grid input::-webkit-outer-spin-button,.grid input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.grid input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;color:var(--muted)}
.chk.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.row-done input{background:var(--soft);border-color:transparent}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:800 21px "Saira Condensed",sans-serif;background:var(--pri);color:var(--pri-ink);margin-top:8px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font:500 16px "Saira",sans-serif}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--danger);font:500 15px "Saira",sans-serif}
/* run */
.phase{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 16px;text-align:center;margin-bottom:12px}
.phase.z3{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.phase .label{font-size:18px;font-weight:600}
.phase .clock{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:96px;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.phase .next{font-size:15px;opacity:.8}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;background:var(--amber);width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.steps{display:flex;gap:3px;margin:10px 0 16px}
.steps i{height:12px;min-width:6px;border-radius:3px;background:var(--line)}
.steps i.z3{background:var(--pri-text);opacity:.35}
.steps i.past{background:var(--z1)}
.steps i.past.z3{background:var(--pri-text);opacity:1}
.steps i.cur{background:var(--frost);opacity:1}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.feel button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px}
.feel button.on{border-color:var(--pri-text);background:var(--soft);font-weight:600}
/* history */
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.chart svg{display:block;width:100%;height:auto}
.hist-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.hist-row strong{font-weight:600}
.hist-row .sets{color:var(--muted);font-size:15px;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* rest + tabs */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:none;padding:0 12px 8px}
.rest.show{display:block}
.rest-in{max-width:576px;margin:0 auto;background:var(--frost);color:#0A1319;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.rest-in .t{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:30px;flex:1;font-variant-numeric:tabular-nums}
.rest-in .t small{font:500 14px "Saira",sans-serif;display:block;margin-top:-4px}
.rest-in button{border:0;background:rgba(255,255,255,.35);border-radius:10px;padding:10px 12px;font-weight:600;color:#0A1319}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr}
.tabs button{border:0;background:none;height:64px;font-weight:600;color:var(--muted);font-size:15px}
.tabs button.on{color:var(--pri-text)}
.tabs button span{display:block;font-size:20px;line-height:1}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-weight:500;max-width:90%;text-align:center;display:none}
.toast.show{display:block}
.flash{position:fixed;inset:0;z-index:30;background:var(--pri);color:var(--pri-ink);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.flash.show{display:flex}
.flash b{font:800 52px/1 "Saira Condensed","Arial Narrow",sans-serif;text-transform:uppercase}
.flash span{font-size:15px;opacity:.75}
@media (prefers-reduced-motion:no-preference){.flash.show b{animation:pulse .6s ease-in-out 3}@keyframes pulse{50%{transform:scale(1.08)}}}
@media (prefers-reduced-motion:no-preference){.chk.on{animation:pop .18s ease-out}@keyframes pop{50%{transform:scale(1.08)}}}

.users{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:0 0 12px}
.users button{border:0;background:none;border-radius:10px;padding:10px;font-weight:600;color:var(--muted)}
.users button.on{background:var(--pri);color:var(--pri-ink)}
button.day{font:inherit;width:100%}
.day.sel{background:var(--pri);border-color:var(--pri)}
.day.sel b,.day.sel span{color:var(--pri-ink)}
.day.sel.done span::after{color:var(--pri-ink)}
.day span.sm{font-size:13px}
.edit-day{display:block;width:100%;border:0;background:none;color:var(--pri-ink);opacity:.8;text-decoration:underline;margin-top:12px;font-size:15px;padding:6px}
.modal{position:fixed;inset:0;z-index:25;display:none}
.modal.show{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.modal-in{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto}
.modal-in h2{font-size:26px;margin-bottom:6px}
.modal-in p{margin:0 0 12px;color:var(--muted)}
.modal-in input,.modal-in textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 18px "Saira",sans-serif;padding:12px}
.modal-in textarea{font-size:13px;height:140px}
.err{color:var(--danger)!important;font-weight:500;min-height:1.2em;margin:8px 0 0!important}
.chips{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.chips button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px}
.chips button b{min-width:30px;font-family:"Saira Condensed",sans-serif;font-size:18px;color:var(--pri-text)}
.chips button.on{border-color:var(--pri-text);background:var(--soft);font-weight:600}
.chips button.on::after{content:"✓";margin-left:auto;color:var(--pri-text)}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pl-top small{font-weight:600;opacity:.8}
.streak{text-align:center;background:var(--pri-ink);color:var(--pri);border-radius:14px;padding:6px 12px;font-size:20px;line-height:1}
.streak b{display:block;font:800 28px "Saira Condensed",sans-serif}
.streak small{font-size:12px;opacity:.85}
.mico{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:20px}
.item.on .mico{background:var(--pri);color:var(--pri-ink);font-weight:800}
.xp{font:800 16px "Saira Condensed",sans-serif;color:var(--pri-text);white-space:nowrap}
.item.on .xp{opacity:.5}
.bonus{margin:10px 0 0;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:15px}
.bonus.on{border-style:solid;border-color:var(--pri-text);color:var(--pri-text);font-weight:600}
.hint{color:var(--muted);font-size:13px;margin:6px 2px 0}
.gbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 4px}
.gbar i{display:block;height:100%;background:var(--pri-text)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.badge{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;opacity:.45;filter:grayscale(1)}
.badge.ok{opacity:1;filter:none;border-color:var(--pri-text)}
.badge span{font-size:26px;display:block}
.badge b{display:block;font-size:12px;line-height:1.2;margin-top:4px}
.badge small{font-size:11px;color:var(--muted)}
.hchip{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;margin:0 0 12px;font-weight:600;text-align:center}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 12px}
.macros div{background:var(--pri-ink);color:var(--pri);border-radius:12px;padding:8px 4px;text-align:center}
.macros b{display:block;font:800 20px "Saira Condensed",sans-serif}
.macros small{font-size:12px;opacity:.85}
.pbar{height:10px;background:rgba(0,0,0,.15);border-radius:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pri-ink)}
.item.check .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:var(--pri-ink)}
.item.check.on .box{background:var(--pri);border-color:var(--pri)}
.item.check.on{background:var(--soft)}
.water{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.water div{flex:1;text-align:center}
.water b{display:block;font:800 28px "Saira Condensed",sans-serif}
.water small{color:var(--muted)}
.water button{width:52px;height:52px;border-radius:12px;border:0;background:var(--pri);color:var(--pri-ink);font-size:26px;font-weight:700}
.sleep{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}
.sleep label{flex:1;font-weight:500}
.sleep input{width:110px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:600 18px "Saira",sans-serif}
</style>
</head>
<body>
<div id="app"></div>
<div class="rest" id="rest"><div class="rest-in">
  <div class="t" id="restT">0:00<small>Descanso</small></div>
  <button data-act="rest-add" data-v="-15">−15s</button>
  <button data-act="rest-add" data-v="15">+15s</button>
  <button data-act="rest-skip">Pular</button>
</div></div>
<nav class="tabs"><div class="tabs-in">
  <button data-act="tab" data-v="home" id="tabHome"><span>🏋️</span>Treino</button>
  <button data-act="tab" data-v="diet" id="tabDiet"><span>🎯</span>Missões</button>
  <button data-act="tab" data-v="history" id="tabHist"><span>📈</span>Histórico</button>
</div></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-bg" data-act="modal-close"></div><div class="modal-in" id="modal-in"></div></div>
<div class="flash" id="flash" data-act="flash-off"><b></b><span>Toque para fechar</span></div>

function unlockAudio(){try{if(navigator.audioSession)navigator.audioSession.type="ambient"}catch(e){}try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume()}catch(e){}}
function tone(f,d,t0,vol){const o=ac.createOscillator(),g=ac.createGain();o.type="square";o.frequency.value=f;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t0;g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}
function beep(f=880,d=.18,vib=250){try{unlockAudio();tone(f,d,0,.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate(vib)}catch(e){}}
function alarm(msg){
  try{unlockAudio();[0,.32,.64,1.1,1.42,1.74].forEach(t=>tone(1046,.22,t,.6))}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([400,150,400,150,400])}catch(e){}
  const f=$("#flash");f.querySelector("b").textContent=msg;f.classList.add("show");clearTimeout(alarm.h);alarm.h=setTimeout(()=>f.classList.remove("show"),4000);
  try{if(document.hidden&&"Notification"in window&&Notification.permission==="granted")new Notification("TURUGYM",{body:msg})}catch(e){}
}

function fixLog(l){if(l&&!l.u)l.u=(W[l.w]&&W[l.w].u)||"artur";return l}
function lsLoad(){
  try{logs=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){logs={}}

function push(id){
  if(!S.col||!logs[id])return;
  clearTimeout(S.timers[id]);
  S.timers[id]=setTimeout(()=>{
    if(!logs[id])return;const data=JSON.parse(JSON.stringify(logs[id]));
    S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>S.col.doc(id).set(data)).catch(()=>{});
  },700);
}
function save(id){logs[id].upd=Date.now();lsSave();push(id);ghSchedule()}
function remove(id){delete logs[id];dead[id]=Date.now();try{localStorage.setItem(LSDEAD,JSON.stringify(dead))}catch(e){}lsSave();ghSchedule();if(S.col){S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>S.col.doc(id).delete()).catch(()=>{})}}
function pushSched(){if(!S.col)return;const d={sched:JSON.parse(JSON.stringify(sched)),upd:schedUpd};S.chain._s=(S.chain._s||Promise.resolve()).then(()=>S.col.doc("_sched").set(d)).catch(()=>{})}

async function cloudInit(){
  if(!window.claude||!window.claude.use)return;
  try{
    const[db,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!u)return;
    const uid=await u.id();if(!uid)return;
    S.col=db.collection("data/users/"+uid);
    const snap=await S.col.get();const seen=new Set(),seenDiet=new Set();let remoteSched=null;
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;
      if(d.id==="_sched"){remoteSched=v;return}
      if(d.id.indexOf("_diet_")===0){const k=v.key;if(k){seenDiet.add(k);if(!diet[k]||(v.upd||0)>(diet[k].upd||0))diet[k]={...v.data,upd:v.upd||0}}return}
      if(!v.id)return;fixLog(v);seen.add(d.id);
      if(!logs[v.id]||(v.upd||0)>=(logs[v.id].upd||0))logs[v.id]=v;else push(v.id)});
    Object.keys(logs).forEach(k=>{if(!seen.has(k))push(k)});
    if(remoteSched&&(remoteSched.upd||0)>schedUpd){sched=remoteSched.sched||{};schedUpd=remoteSched.upd||0;try{localStorage.setItem(LSS,JSON.stringify({sched,upd:schedUpd}))}catch(e){}}
    else if(schedUpd>0)pushSched();
    lsSave();try{localStorage.setItem(LSD,JSON.stringify(diet))}catch(e){}Object.keys(diet).forEach(k=>{if(!seenDiet.has(k))pushDiet(k)});S.cloud=true;
    if(view.name!=="workout"&&view.name!=="run")render();else{const e=$("#sync");if(e)e.textContent="☁︎ salvo"}
  }catch(e){}
}
function getLog(wid,date,u=user){
  const id=date+"_"+wid+(W[wid].u===u?"":"_"+u);
  if(!logs[id])logs[id]={id,date,w:wid,u,sets:{},done:false,upd:0};
  return logs[id];
}
function hasData(l){if(!l)return false;if(l.done)return true;return Object.values(l.sets||{}).some(a=>a.some(s=>s&&s.ok))}
const mine=()=>Object.values(logs).filter(l=>l.u===user);
function prevSets(exId,beforeId){
  const arr=mine().filter(l=>l.id!==beforeId&&l.sets&&l.sets[exId]&&l.sets[exId].some(s=>s&&s.ok)).sort((a,b)=>b.date.localeCompare(a.date)||(b.upd-a.upd));
  return arr[0]?arr[0].sets[exId]:null;
}
function lastDone(wid){const a=mine().filter(l=>l.w===wid&&hasData(l)).sort((a,b)=>b.date.localeCompare(a.date));return a[0]?a[0].date:null}
function plan(dow,u=user){const s=sched[u];if(s&&s[dow]!==undefined)return s[dow].filter(w=>W[w]&&W[w].u===u);return USERS[u].def[dow]||[]}

function hdr(title,sub,back){

function home(){
  const now=new Date(),tdow=now.getDay(),t=today();
  const dow=selDow==null?tdow:selDow;
  const mon=new Date(now);mon.setDate(now.getDate()-((tdow+6)%7));
  let week="",selDate=t;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);const k=ds(d),wd=d.getDay();
    const doneW=mine().filter(l=>l.date===k&&hasData(l)).map(l=>l.w);
    const show=doneW.length?doneW:plan(wd);
    const lab=show.length?show.map(w=>W[w].ico||W[w].k).join(""):"–";
    if(wd===dow)selDate=k;
    week+=`<button class="day${k===t?" today":""}${wd===dow?" sel":""}${doneW.length?" done":""}" data-act="day" data-v="${wd}" aria-label="${DFULL[wd]}"><b>${DN[wd]}</b><span class="${lab.length>2?"sm":""}">${lab}</span></button>`;
  }
  const pl=plan(dow),isT=dow===tdow;
  let card=`<div class="today-card"><h2 style="font-size:30px">${isT?"Hoje, ":""}${DFULL[dow]} ${br(selDate)}</h2>`;
  if(!pl.length)card+=`<p>Dia de descanso.</p>`;
  else{
    card+=`<p>${isT?(pl.length>1?"Na ordem abaixo.":"Bora."):"Quer adiantar? Pode fazer hoje mesmo."}</p>`;
    pl.forEach(w=>{const ok=hasData(logs[t+"_"+w]);card+=`<button class="go${ok?" ok":""}" data-act="open" data-v="${w}"><span><strong>${W[w].n}</strong><small>${ok?"Feito hoje ✓ toque para revisar":W[w].s}</small></span><span style="font-size:26px">›</span></button>`});
  }
  card+=`<button class="edit-day" data-act="edit-day" data-v="${dow}">✎ Mudar os treinos de ${DFULL[dow]}</button></div>`;
  let list="";
  USERS[user].list.forEach(w=>{
    const ld=lastDone(w);
    list+=`<button class="item" data-act="open" data-v="${w}"><span class="letter${isRun(w)?" run":""}">${W[w].k}</span><div><strong>${W[w].n} <span style="color:var(--muted);font-weight:400">${W[w].s}</span></strong><small>${ld?"Última vez: "+br(ld):"Ainda não feito"}</small></div><span>›</span></button>`;
  });
  const St=stats(),Lv=lvl(St.xp),TX=(St.dx[t]||dayXP(t));

}

function workout(){
  const w=W[cur.w],l=cur;
  let h=hdr(w.n,w.s+" · "+br(l.date)+" · "+USERS[l.u||w.u].n,"home")+`<main>`;
  if(w.warm)h+=`<p class="note">${w.warm}<br><b>Progressão:</b> bateu o topo da faixa em todas as séries? Suba 2,5–5 kg no próximo treino.${(l.u||w.u)==="artur"?"<br><b>Até a avaliação médica:</b> pare com 2–3 reps sobrando, sem ir até a falha. Tontura? Pare, sente e beba água.":""}</p>`;
  w.ex.forEach((e,ei)=>{
    const ex=EX[e.id],t=ex.t||"kg",sets=l.sets[e.id]||[],prev=prevSets(e.id,l.id);
    const restTxt=e.rest?(e.rest>=60&&e.rest%60===0?e.rest/60+" min":e.rest+"s"):"sem descanso";
    const nums=e.rg?e.r.length+"×"+e.rg:(e.r.every(x=>x===e.r[0])?e.r.length+"×"+e.r[0]:e.r.join("-"));
    h+=`<section class="ex"><div class="ex-head"><h3>${ex.n}</h3><span class="meta">${nums} · ${restTxt}</span></div>`;
    if(e.tag)h+=`<div class="tag">${e.tag}</div>`;
    const cls=t==="kg"?"grid":t==="bw"?"grid nokg":"grid time";
    h+=`<div class="${cls}"><span class="gh">Série</span><span class="gh l">Anterior</span>${t==="kg"?`<span class="gh">${e.h?"kg cada":"kg"}</span>`:""}${t!=="time"?'<span class="gh">Reps</span>':""}<span class="gh">✓</span></div>`;
    e.r.forEach((target,si)=>{
      const s=sets[si]||{},p=prev&&prev[si]&&prev[si].ok?prev[si]:null;
      const sg=e.sug!=null?(Array.isArray(e.sug)?e.sug[si]:e.sug):null;
      let prevTxt=p?(t==="kg"?fmt(p.kg||0)+" × "+p.reps:t==="bw"?p.reps+" reps":"feito"):(sg!=null&&t==="kg"?"sugerido":"—");

function weekGoals(mon){
  const P=DIET[user],days=[];for(let i=0;i<7;i++){const d=new Date(mon+"T12:00:00");d.setDate(d.getDate()+i);days.push(ds(d))}
  const L=mine().filter(l=>days.includes(l.date)&&hasData(l)&&W[l.w]);
  const gym=new Set(L.filter(l=>!isRun(l.w)).map(l=>l.date)).size;
  const card=Math.round(L.filter(l=>isRun(l.w)&&l.done).reduce((a,l)=>a+phases(l.w).reduce((b,p)=>b+p.d,0),0)/60);
  const sl=days.filter(d=>{const x=dpeek(d);return x&&x.sl!=null&&x.sl>=P.sleep}).length;
  const G=[{ico:"🏋️",t:"4 treinos de musculação",v:gym,max:4,xp:60},{ico:"🏃",t:P.cardioWeek+" min de cardio",v:card,max:P.cardioWeek,xp:60,u:" min"}];
  if(P.meals)G.push({ico:"🍗",t:"Proteína batida em 5 dias",v:days.filter(d=>protOf(dpeek(d),P)>=P.p*0.9).length,max:5,xp:50});
  G.push({ico:"😴",t:"Sono de "+P.sleep+"h+ em 4 noites",v:sl,max:4,xp:50});
  G.forEach(g=>g.done=g.v>=g.max);return G;
}
function stats(){
  const dates=userDates(),dx={},valid=new Set();let xp=0,perfect=0;
  dates.forEach(d=>{const r=dayXP(d);dx[d]=r;xp+=r.xp;if(r.all)perfect++;if(r.valid)valid.add(d)});
  [...new Set(dates.map(monOf))].forEach(w=>weekGoals(w).forEach(g=>{if(g.done)xp+=g.xp}));
  let st=0;const c=new Date();if(!valid.has(today()))c.setDate(c.getDate()-1);while(valid.has(ds(c))){st++;c.setDate(c.getDate()-1)}
  let best=0,run=0,prev=null;[...valid].sort().forEach(d=>{if(prev){const p=new Date(prev+"T12:00:00");p.setDate(p.getDate()+1);run=ds(p)===d?run+1:1}else run=1;best=Math.max(best,run);prev=d});
  return{xp,st,best,perfect,dx,dates};
}
function lvl(xp){let n=1,need=200,acc=0;while(xp>=acc+need){acc+=need;n++;need=200+(n-1)*100}return{n,acc,need,title:LV[Math.min(n-1,LV.length-1)]}}
function badges(St){
  const P=DIET[user],L=mine().filter(l=>hasData(l)&&W[l.w]);
  const gymN=new Set(L.filter(l=>!isRun(l.w)).map(l=>l.date)).size,carN=L.filter(l=>isRun(l.w)&&l.done).length;
  const cnt=f=>St.dates.filter(d=>f(dpeek(d))).length;
  const wN=cnt(x=>x&&x.w>=P.water),sN=cnt(x=>x&&x.sl!=null&&x.sl>=P.sleep);
  return[
    {ico:"👣",t:"Primeiro passo",s:"1 missão",ok:St.xp>0},
    {ico:"🏋️",t:"10 treinos",s:Math.min(gymN,10)+"/10",ok:gymN>=10},
    {ico:"🏃",t:"10 cardios",s:Math.min(carN,10)+"/10",ok:carN>=10},
    {ico:"⭐",t:"Dia perfeito",s:St.perfect+"×",ok:St.perfect>=1},
    {ico:"💧",t:"Hidratado",s:Math.min(wN,7)+"/7",ok:wN>=7},
    {ico:"😴",t:"Bem dormido",s:Math.min(sN,7)+"/7",ok:sN>=7},
    {ico:"🔥",t:"Sequência 7",s:"melhor "+St.best,ok:St.best>=7},
    {ico:"🌋",t:"Sequência 30",s:"melhor "+St.best,ok:St.best>=30}];
}
let lastXP=null,lastUser=null;
function levelUp(n){try{unlockAudio();[523,659,784,1046].forEach((f,i)=>tone(f,.18,i*.15,.45))}catch(e){}const f=$("#flash");f.querySelector("b").textContent="Nível "+n+"! "+LV[Math.min(n-1,LV.length-1)];f.classList.add("show");clearTimeout(alarm.h);alarm.h=setTimeout(()=>f.classList.remove("show"),3500)}
function xpCheck(){const x=stats().xp;if(lastXP!=null&&lastUser===user&&x>lastXP){const a=lvl(lastXP).n,b=lvl(x).n;if(b>a)levelUp(b);else toast("+"+(x-lastXP)+" XP 💪")}lastXP=x;lastUser=user}
function dietView(){
  const P=DIET[user],t=today(),d=dget(),St=stats(),Lv=lvl(St.xp),T=St.dx[t]||dayXP(t);
  const pct=Math.round((St.xp-Lv.acc)/Lv.need*100);
  let h=hdr("Missões","Perfil "+USERS[user].n+" · hoje "+br(t))+`<main>${userPills()}`;
  h+=`<div class="today-card"><div class="pl-top"><div><small>Nível ${Lv.n}</small><h2 style="font-size:30px">${Lv.title}</h2></div><div class="streak">🔥<b>${St.st}</b><small>${St.st===1?"dia":"dias"}</small></div></div><div class="pbar"><i style="width:${pct}%"></i></div><p style="margin:6px 0 0">${fmt(St.xp-Lv.acc)} de ${fmt(Lv.need)} XP para o nível ${Lv.n+1} · hoje <b>+${T.xp} XP</b></p></div>`;
  h+=`<h2 class="section-title">Missões de hoje</h2><div class="list">`+T.M.map(m=>{const a=m.go?`data-act="open" data-v="${m.go}"`:m.tog?`data-act="diet-sup" data-v="${m.tog}"`:`data-act="m-go" data-v="${m.to}"`;return`<button class="item mis${m.done?" on":""}" ${a}><span class="mico">${m.done?"✓":m.ico}</span><div><strong>${m.t}</strong><small>${m.s}</small></div><span class="xp">+${m.xp}</span></button>`}).join("")+`</div>`;
  h+=`<p class="bonus${T.all?" on":""}">⭐ Dia perfeito: complete tudo e ganhe +${XP.perfect} XP${T.all?" ✓":""}</p>`;
  h+=`<p class="hint">A sequência 🔥 conta os dias em que você fez pelo menos 60% do XP do dia.</p>`;
  h+=`<h2 class="section-title" style="margin-top:20px">Metas da semana</h2><div class="list">`+weekGoals(monOf(t)).map(g=>`<div class="item goal${g.done?" on":""}"><span class="mico">${g.done?"✓":g.ico}</span><div><strong>${g.t}</strong><div class="gbar"><i style="width:${Math.min(100,Math.round(g.v/g.max*100))}%"></i></div><small>${fmt(g.v)}${g.u||""} de ${fmt(g.max)}${g.u||""}</small></div><span class="xp">+${g.xp}</span></div>`).join("")+`</div>`;
  if(P.meals){
    const pr=protOf(d,P);
    h+=`<h2 class="section-title" id="sec-meals" style="margin-top:20px">Refeições</h2><p class="note">Metas: ${fmt(P.kcal)} kcal · ${P.p} g de proteína · ${P.g} g de gordura · ${P.c} g de carbo<br>Proteína marcada hoje: <b>${pr} de ${P.p} g</b></p><div class="list">`+P.meals.map(m=>`<button class="item check${d.m[m.id]?" on":""}" data-act="diet-meal" data-v="${m.id}"><span class="box">${d.m[m.id]?"✓":""}</span><div><strong>${m.t}</strong><small>${m.d} · ~${m.p} g de proteína</small></div></button>`).join("")+`</div>`;
  }
  h+=`<h2 class="section-title" id="sec-water" style="margin-top:20px">Água</h2><div class="water"><button data-act="diet-w" data-v="-1" aria-label="Menos um copo">−</button><div><b>${(d.w*0.25).toLocaleString("pt-BR",{maximumFractionDigits:2})} L</b><small>${d.w} de ${P.water} copos de 250 ml</small></div><button data-act="diet-w" data-v="1" aria-label="Mais um copo">+</button></div>`;
  if(P.sups.length)h+=`<h2 class="section-title" id="sec-sup" style="margin-top:20px">Suplementos</h2><div class="list">`+P.sups.map(s=>`<button class="item check${d.s[s.id]?" on":""}" data-act="diet-sup" data-v="${s.id}"><span class="box">${d.s[s.id]?"✓":""}</span><div><strong>${s.n}</strong>${s.d?`<small>${s.d}</small>`:""}</div></button>`).join("")+`</div>`;
  h+=`<h2 class="section-title" id="sec-sleep" style="margin-top:20px">Sono</h2><div class="sleep"><label for="sleepIn">Horas dormidas esta noite</label><input id="sleepIn" inputmode="decimal" value="${d.sl??""}" placeholder="meta ${P.sleep}h"></div>`;
  h+=`<h2 class="section-title" style="margin-top:20px">Conquistas</h2><div class="badges">`+badges(St).map(b=>`<div class="badge${b.ok?" ok":""}"><span>${b.ico}</span><b>${b.t}</b><small>${b.s}</small></div>`).join("")+`</div>`;
  h+=`<h2 class="section-title" style="margin-top:20px">Regras do plano</h2><p class="note">${P.rules.map(r=>"• "+r).join("<br>")}</p>`;
  return h+`</main>`;
}

/* ---------- sync GitHub ---------- */
const GH={owner:"aarturaraujob-collab",repo:"turugym",path:"data/turugym.json",branch:"main"};
const LSG="th_gh_token",LSDEAD="th_dead_v1";
let dead={},ghTok=null,ghSha=null,ghBusy=false,ghDirty=false,ghTimer=null,ghState="off",ghMsg="";
function ghLoadTok(){try{ghTok=localStorage.getItem(LSG)||null}catch(e){}try{dead=JSON.parse(localStorage.getItem(LSDEAD)||"{}")||{}}catch(e){dead={}}}
function b64e(str){return btoa(unescape(encodeURIComponent(str)))}
function b64d(b){return decodeURIComponent(escape(atob(b.replace(/\s/g,""))))}
function canon(v){if(Array.isArray(v))return"["+v.map(canon).join(",")+"]";if(v&&typeof v==="object")return"{"+Object.keys(v).sort().map(k=>JSON.stringify(k)+":"+canon(v[k])).join(",")+"}";return JSON.stringify(v===undefined?null:v)}
function ghUrl(){return`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`}
function ghHead(tok){return{Authorization:"Bearer "+(tok||ghTok),Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}}
function ghLabel(){return ghState==="sync"?"⟳ GitHub":ghState==="ok"?"✓ GitHub":ghState==="err"?"⚠︎ GitHub":""}
function ghPaint(){const e=$("#sync");if(e)e.textContent=ghLabel()||(S.cloud?"☁︎ salvo":"")}
function ghSchedule(){if(!ghTok)return;ghDirty=true;clearTimeout(ghTimer);ghTimer=setTimeout(ghSync,2500)}
async function ghPull(){
  const r=await fetch(ghUrl()+"?ref="+GH.branch+"&t="+Date.now(),{headers:ghHead(),cache:"no-store"});
  if(r.status===404){ghSha=null;return null}
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();ghSha=j.sha;const txt=b64d(j.content||"");
  let obj=null;try{obj=JSON.parse(txt)}catch(e){}
  if(obj){const before=canon(JSON.parse(backupText()));restore(txt);const after=canon(JSON.parse(backupText()));if(before!==after&&view.name!=="workout"&&view.name!=="run")render()}
  return obj;
}
async function ghPush(){
  const body={message:"TURUGYM: dados "+new Date().toLocaleString("pt-BR"),content:b64e(backupText()),branch:GH.branch};if(ghSha)body.sha=ghSha;
  const r=await fetch(ghUrl(),{method:"PUT",headers:{...ghHead(),"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(r.status===409||r.status===422)return false;
  if(!r.ok)throw new Error("HTTP "+r.status);
  const j=await r.json();ghSha=j.content&&j.content.sha;return true;
}
async function ghSync(){
  if(!ghTok)return;
  if(ghBusy){ghSchedule();return}
  ghBusy=true;ghState="sync";ghPaint();
  try{
    for(let i=0;i<3;i++){
      const remote=await ghPull();
      const need=ghDirty||!remote||canon(remote)!==canon(JSON.parse(backupText()));
      ghDirty=false;
      if(!need||await ghPush())break;
    }
    ghState="ok";ghMsg="Sincronizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){ghState="err";ghMsg=/401|403/.test(String(e))?"Token inválido ou sem permissão de escrita.":"Sem conexão com o GitHub. Tento de novo depois."}
  ghBusy=false;ghPaint();
  if(view.name==="history"){const m=$("#ghMsg");if(m)m.textContent=ghMsg}
}
function ghCard(){
  if(!ghTok)return`<div class="note"><b>Salvar no GitHub</b><br>Guarda todos os dados no seu repositório turugym, para nada se perder ao trocar de celular. Cada celular conecta uma vez.<br><button class="btn" style="margin-top:10px" data-act="gh-open">Conectar GitHub</button></div>`;
  return`<div class="note"><b>Salvando no GitHub ${ghLabel()}</b><br><span id="ghMsg">${esc(ghMsg||"Conectado")}</span><div class="row-btns" style="margin-top:10px"><button class="btn ghost" data-act="gh-sync">Sincronizar agora</button><button class="btn ghost" data-act="gh-off">Desconectar</button></div></div>`;
}
function ghModal(){openModal(`<h2>Conectar GitHub</h2><p>Cole o token do GitHub com permissão <b>Contents: Read and write</b> no repositório turugym. Ele fica salvo só neste celular.</p><input id="ghTok" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_..."><p class="err" id="ghErr"></p><button class="btn" data-act="gh-save">Conectar</button><button class="btn ghost" data-act="modal-close">Cancelar</button>`)}
async function ghConnect(){
  const t=($("#ghTok").value||"").trim();const err=$("#ghErr");
  if(!t){err.textContent="Cole o token.";return}
  err.textContent="Testando…";
  try{
    const r=await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`,{headers:ghHead(t),cache:"no-store"});
    if(!r.ok){err.textContent=r.status===401?"Token inválido.":"Esse token não acessa o repositório turugym.";return}
    const j=await r.json();if(j.permissions&&!j.permissions.push){err.textContent="O token não tem permissão de escrita.";return}
  }catch(e){err.textContent="Não consegui falar com o GitHub. Abra pelo link do GitHub Pages, não pelo Claude.";return}
  ghTok=t;try{localStorage.setItem(LSG,t)}catch(e){}
  closeModal();toast("GitHub conectado. Sincronizando…");ghDirty=true;await ghSync();render();
}

/* ---------- eventos ---------- */
document.addEventListener("input",e=>{
  const el=e.target;if(el.id==="sleepIn"){const d=dget();const x=parseFloat(el.value.replace(",","."));d.sl=isNaN(x)?null:x;dsave();return}
  if(!el.dataset||!el.dataset.in||!cur)return;
  const ex=W[cur.w].ex[+el.dataset.e],si=+el.dataset.s;
  const a=cur.sets[ex.id]=cur.sets[ex.id]||[];a[si]=a[si]||{};
  const v=el.value.replace(",",".");a[si][el.dataset.in]=v===""?null:+v;
  if(a[si].ok)save(cur.id);
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="who"){e.preventDefault();confirmFinish()}});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,v=b.dataset.v;
  if(act==="flash-off"){$("#flash").classList.remove("show");return}
  if(act==="modal-close"){closeModal();return}
  if(act==="tab"){go({name:v});return}
  if(act==="gh-open"){ghModal();return}
  if(act==="gh-save"){ghConnect();return}
  if(act==="gh-sync"){ghDirty=true;ghSync().then(render);return}
  if(act==="gh-off"){if(!confirm("Desconectar o GitHub neste celular? Os dados continuam salvos no repositório."))return;ghTok=null;ghState="off";try{localStorage.removeItem(LSG)}catch(e){}render();return}
  if(act==="m-go"){const t=document.getElementById(v);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(act==="hchip"){go({name:"diet"});return}
  if(act==="diet-meal"){const d=dget();d.m[v]=!d.m[v];dsave();render();return}
  if(act==="diet-sup"){const d=dget();d.s[v]=!d.s[v];dsave();render();return}
  if(act==="diet-w"){const d=dget();d.w=Math.max(0,d.w+(+v));dsave();render();return}
  if(act==="user"){if(v===user)return;user=v;try{localStorage.setItem(LSU,v)}catch(e){}selDow=null;R=null;render();toast("Perfil: "+USERS[v].n);return}
  if(act==="day"){selDow=+v;render();return}
  if(act==="home"){if(R&&R.on){R.on=false;R.left=(R.end-Date.now())/1000}wakeOff();go({name:"home"});return}
  if(act==="tab-history"){go({name:"history"});return}
  if(act==="open"){cur=getLog(v,today());go({name:isRun(v)?"run":"workout"});return}
  if(act==="exd"){go({name:"exercise",id:v});return}
  if(act==="edit-day"){ED={dow:+v,sel:plan(+v).slice()};openModal(dayModal());return}
  if(act==="toggle-day-w"){const L=USERS[user].list;ED.sel=ED.sel.includes(v)?ED.sel.filter(x=>x!==v):L.filter(x=>x===v||ED.sel.includes(x));$("#modal-in").innerHTML=dayModal();return}
  if(act==="save-day"){sched[user]=sched[user]||{};sched[user][ED.dow]=ED.sel.slice();saveSched();closeModal();render();toast(DFULL[ED.dow]+" atualizada");return}
  if(act==="reset-day"){if(sched[user])delete sched[user][ED.dow];saveSched();closeModal();render();toast(DFULL[ED.dow]+" voltou ao padrão");return}
  if(act==="chk"){
    const ex=W[cur.w].ex[+b.dataset.e],si=+b.dataset.s;
    const a=cur.sets[ex.id]=cur.sets[ex.id]||[];const s=a[si]=a[si]||{};
    if(s.ok){s.ok=false;save(cur.id);render();return}
    const row=b.parentElement,kgI=row.querySelector('[data-in="kg"]'),rI=row.querySelector('[data-in="reps"]');
    if(kgI&&(s.kg==null||s.kg==="")){const ph=parseFloat((kgI.placeholder||"").replace(",","."));s.kg=isNaN(ph)?0:ph}
    if(rI&&(s.reps==null||s.reps==="")){const ph=parseInt(rI.placeholder,10);s.reps=isNaN(ph)?0:ph}
    s.ok=true;save(cur.id);beep(1200,.06);
    render();if(ex.rest)startRest(ex.rest);else stopRest();
    return;
  }
  if(act==="finish"){if(!hasData(cur)){toast("Conclua pelo menos uma série antes de finalizar");return}openFinish();return}
  if(act==="confirm-finish"){confirmFinish();return}
  if(act==="del"){if(!confirm("Apagar o registro de "+W[cur.w].n+" de "+br(cur.date)+"?"))return;remove(cur.id);R=null;toast("Registro apagado");go({name:"home"});return}
  if(act==="wipe"){if(!confirm("Apagar todo o histórico de "+USERS[user].n+"? Isso não pode ser desfeito."))return;mine().forEach(l=>remove(l.id));toast("Histórico apagado");go({name:"history"});return}
  if(act==="bk-wa"){const t="Backup TURUGYM "+br(today())+" · não edite o texto abaixo\n"+backupText();
    if(navigator.share){navigator.share({text:t}).then(()=>toast("Backup enviado"),err=>{if(err&&err.name==="AbortError")return;waLink(t)})}else waLink(t);return}
  if(act==="bk-copy"){const t=backupText();
    const show=()=>openModal(`<h2>Backup</h2><p>Copie todo o texto abaixo e guarde nas Notas ou no WhatsApp.</p><textarea readonly id="bk">${esc(t)}</textarea><button class="btn ghost" data-act="modal-close">Fechar</button>`);
    try{navigator.clipboard.writeText(t).then(()=>toast("Backup copiado. Cole nas Notas ou no WhatsApp."),show)}catch(err){show()}return}
  if(act==="bk-open"){openModal(`<h2>Restaurar backup</h2><p>Copie a mensagem do backup inteira (do WhatsApp ou das Notas) e cole aqui. Nada que você já tem é apagado: só entra o que for mais novo.</p><textarea id="bk" placeholder="Cole o backup aqui"></textarea><p class="err" id="bkErr"></p><button class="btn" data-act="bk-restore">Restaurar</button><button class="btn ghost" data-act="modal-close">Cancelar</button>`);return}
  if(act==="bk-restore"){const r=restore($("#bk").value);if(typeof r==="string"){$("#bkErr").textContent=r;return}closeModal();render();toast(r+" registros restaurados");return}
  if(act==="rest-add"){rest.end+=(+v)*1000;if(rest.end<=Date.now())stopRest();else paintRest();return}
  if(act==="rest-skip"){stopRest();return}
  if(act==="run-toggle"){
    if(R.i>=R.ph.length){R=null;render();return}
    if(R.on){R.on=false;R.left=(R.end-Date.now())/1000;wakeOff()}else{R.on=true;R.end=Date.now()+R.left*1000;beep(760,.2);wakeOn()}
    runPaint();return;
  }
  if(act==="run-skip"){if(R.i<R.ph.length){const was=R.on;runAdvance();if(R&&!was&&R.i<R.ph.length){R.left=R.ph[R.i].d}runPaint()}return}
  if(act==="feel"){cur.feel=v;save(cur.id);render();return}
  if(act==="run-done"){openFinish();return}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(R&&R.on)wakeOn();if(ghTok)ghSync()}});
document.addEventListener("pointerdown",unlockAudio,{passive:true});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="sleepIn")render()});

lsLoad();ghLoadTok();render();cloudInit();if(ghTok)ghSync();
</script>
