<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TURUGYM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Saira+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F7;--card:#FFFFFF;--ink:#0F1E26;--muted:#566A74;--line:#D3E0E6;
  --pri:#B5E425;--pri-ink:#0F1E26;--pri-text:#4A7600;--soft:#EAF6C9;--amber:#2A7FA0;--amber-soft:#DCEFF6;--frost:#A6E1F1;--z1:#8197A2;--danger:#B3412E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1319;--card:#111E26;--ink:#E6F1F5;--muted:#8BA2AD;--line:#1E3240;
    --pri:#C6F135;--pri-ink:#0A1319;--pri-text:#C6F135;--soft:#1E3118;--amber:#74D0EA;--amber-soft:#12303D;--frost:#74D0EA;--z1:#5F7782;--danger:#E06A55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1319;--card:#111E26;--ink:#E6F1F5;--muted:#8BA2AD;--line:#1E3240;
    --pri:#C6F135;--pri-ink:#0A1319;--pri-text:#C6F135;--soft:#1E3118;--amber:#74D0EA;--amber-soft:#12303D;--frost:#74D0EA;--z1:#5F7782;--danger:#E06A55;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Saira",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3,.big{font-family:"Saira Condensed","Arial Narrow",system-ui,sans-serif;font-weight:700;letter-spacing:.01em;margin:0}
h1,h2{font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.top .sub{text-transform:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri-text);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px 10px;max-width:600px;margin:0 auto}
.top h1{font-size:28px;line-height:1.1;flex:1}
.top .sub{display:block;font-family:"Saira",sans-serif;font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0}
.back{border:0;background:var(--card);width:40px;height:40px;border-radius:12px;font-size:22px;line-height:1;flex:none}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
main{max-width:600px;margin:0 auto;padding:4px 16px 150px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 18px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 0 6px;text-align:center}
.day b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.day span{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:17px}
.day.today{border-color:var(--pri-text);box-shadow:inset 0 0 0 1px var(--pri-text)}
.day.done{background:var(--soft)}
.day.done span::after{content:" ✓";color:var(--pri-text);font-size:14px}
.today-card{background:var(--pri);color:var(--pri-ink);border-radius:20px;padding:18px;margin-bottom:22px}
.today-card p{margin:0 0 12px;opacity:.85;font-size:15px}
.today-card .go{display:flex;width:100%;justify-content:space-between;align-items:center;background:var(--pri-ink);color:var(--pri);border:0;border-radius:14px;padding:14px 16px;margin-top:8px;text-align:left}
.today-card .go strong{font-family:"Saira Condensed",sans-serif;font-size:22px;display:block}
.today-card .go small{font-size:14px;opacity:.8}
.today-card .go.ok{opacity:.7}
.section-title{font-size:20px;margin:6px 0 10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.item .letter{width:42px;height:42px;border-radius:12px;background:var(--soft);color:var(--pri-text);display:grid;place-items:center;font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:20px;flex:none}
.item .letter.run{background:var(--amber-soft);color:var(--amber);font-size:15px}
.item div{flex:1;min-width:0}
.item strong{display:block;font-weight:600}
.item small{color:var(--muted);font-size:14px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;margin:0 0 14px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 12px 8px;margin-bottom:12px}
.ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px}
.ex-head h3{font-size:21px;line-height:1.15}
.ex-head .meta{color:var(--muted);font-size:14px;white-space:nowrap}
.tag{color:var(--amber);font-size:14px;margin:2px 2px 6px;font-weight:500}
.grid{display:grid;grid-template-columns:34px 1fr 72px 72px 48px;gap:6px;align-items:center;margin-top:8px}
.grid.nokg{grid-template-columns:34px 1fr 72px 48px}
.grid.time{grid-template-columns:34px 1fr 48px}
.gh{font-size:12px;color:var(--muted);text-align:center}
.gh.l{text-align:left}
.n{font-family:"Saira Condensed",sans-serif;font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.prev{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;font:600 18px "Saira",sans-serif;-moz-appearance:textfield}
.grid input::-webkit-outer-spin-button,.grid input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.grid input::placeholder{color:var(--muted);opacity:.7;font-weight:500}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;color:var(--muted)}
.chk.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.row-done input{background:var(--soft);border-color:transparent}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font:800 21px "Saira Condensed",sans-serif;background:var(--pri);color:var(--pri-ink);margin-top:8px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font:500 16px "Saira",sans-serif}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--danger);font:500 15px "Saira",sans-serif}
/* run */
.phase{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 16px;text-align:center;margin-bottom:12px}
.phase.z3{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.phase .label{font-size:18px;font-weight:600}
.phase .clock{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:96px;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.phase .next{font-size:15px;opacity:.8}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;background:var(--amber);width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.steps{display:flex;gap:3px;margin:10px 0 16px}
.steps i{height:12px;min-width:6px;border-radius:3px;background:var(--line)}
.steps i.z3{background:var(--pri-text);opacity:.35}
.steps i.past{background:var(--z1)}
.steps i.past.z3{background:var(--pri-text);opacity:1}
.steps i.cur{background:var(--frost);opacity:1}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.feel button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 4px}
.feel button.on{border-color:var(--pri-text);background:var(--soft);font-weight:600}
/* history */
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.chart svg{display:block;width:100%;height:auto}
.hist-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.hist-row strong{font-weight:600}
.hist-row .sets{color:var(--muted);font-size:15px;margin-top:2px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
/* rest + tabs */
.rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:none;padding:0 12px 8px}
.rest.show{display:block}
.rest-in{max-width:576px;margin:0 auto;background:var(--frost);color:#0A1319;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.rest-in .t{font-family:"Saira Condensed",sans-serif;font-weight:800;font-size:30px;flex:1;font-variant-numeric:tabular-nums}
.rest-in .t small{font:500 14px "Saira",sans-serif;display:block;margin-top:-4px}
.rest-in button{border:0;background:rgba(255,255,255,.35);border-radius:10px;padding:10px 12px;font-weight:600;color:#0A1319}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tabs button{border:0;background:none;height:64px;font-weight:600;color:var(--muted);font-size:15px}
.tabs button.on{color:var(--pri-text)}
.tabs button span{display:block;font-size:20px;line-height:1}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-weight:500;max-width:90%;text-align:center;display:none}
.toast.show{display:block}
@media (prefers-reduced-motion:no-preference){.chk.on{animation:pop .18s ease-out}@keyframes pop{50%{transform:scale(1.08)}}}
</style>
</head>
<body>
<div id="app"></div>
<div class="rest" id="rest"><div class="rest-in">
  <div class="t" id="restT">0:00<small>Descanso</small></div>
  <button data-act="rest-add" data-v="-15">−15s</button>
  <button data-act="rest-add" data-v="15">+15s</button>
  <button data-act="rest-skip">Pular</button>
</div></div>
<nav class="tabs"><div class="tabs-in">
  <button data-act="tab" data-v="home" id="tabHome"><span>🏋️</span>Treino</button>
  <button data-act="tab" data-v="history" id="tabHist"><span>📈</span>Histórico</button>
</div></nav>
<div class="toast" id="toast"></div>

<script>
/* ---------- plano ---------- */
const EX={
  agpc:{n:"Agachamento c/ peso do corpo",t:"bw"},agl:{n:"Agachamento livre"},lp45:{n:"Leg press 45"},
  ext:{n:"Cadeira extensora"},terra:{n:"Levantamento terra"},abd:{n:"Cadeira abdutora"},pant:{n:"Panturrilha em pé"},
  tabata:{n:"Abdominal Tabata",t:"time"},supr:{n:"Supino reto c/ halteres"},supi:{n:"Supino inclinado c/ halteres"},
  cross:{n:"Crossover polia alta"},elfr:{n:"Elevação frontal c/ halteres"},ella:{n:"Elevação lateral c/ halteres"},
  roscaw:{n:"Rosca bíceps barra W"},conc:{n:"Bíceps concentrado"},pux:{n:"Puxada alta"},remb:{n:"Remada baixa"},
  pulld:{n:"Pulldown"},rems:{n:"Remada supinada"},tribr:{n:"Tríceps barra reta"},cruinv:{n:"Crucifixo invertido"},
  flex:{n:"Cadeira flexora"},remu:{n:"Remada unilateral c/ halter"},desenv:{n:"Desenvolvimento c/ halteres"},
  tricorda:{n:"Tríceps na corda"},prancha:{n:"Prancha",t:"time"},
  hack:{n:"Agachamento hack invertido"},mesa:{n:"Mesa flexora"},thrust:{n:"Elevação pélvica"},pantlp:{n:"Panturrilha no leg press"},
  elevp:{n:"Elevação de pernas deitado",t:"bw"},supm:{n:"Supino máquina"},puxtri:{n:"Puxada neutra (triângulo)"},
  supart:{n:"Supino inclinado articulado"},remm:{n:"Remada máquina pegada neutra"},desm:{n:"Desenvolvimento máquina"},
  martelo:{n:"Rosca martelo c/ halteres"},puxab:{n:"Puxada aberta"},rembt:{n:"Remada baixa c/ triângulo"},
  cruinvm:{n:"Crucifixo inverso máquina"},testa:{n:"Tríceps testa na polia c/ corda"},roscacorda:{n:"Rosca martelo na polia c/ corda"},
  bulg:{n:"Búlgaro"},peck:{n:"Voador (peck deck)"}
};
const F4=[15,15,15,15],P=[15,12,10,8],D4=["máx","máx","máx","máx"],T12=[12,12,12];
const W={
  A:{n:"Treino A",s:"Costas + bíceps",warm:"Mobilidade de ombro + 2 séries leves na puxada. Use strap nas puxadas e remadas se o pulso reclamar.",ex:[
    {id:"puxtri",r:[8,8,8],rg:"6–8",rest:120,sug:60,tag:"Principal do dia. Deixe 1–2 reps no tanque."},
    {id:"remm",r:[10,10,10],rg:"8–10",rest:90,sug:45},
    {id:"puxab",r:[12,12,12],rg:"10–12",rest:90,sug:55},
    {id:"rembt",r:[12,12],rg:"10–12",rest:75,sug:50},
    {id:"cruinvm",r:[15,15,15],rg:"12–15",rest:60,sug:35,tag:"Posterior de ombro: dá a largura do shape visto de frente"},
    {id:"roscaw",r:[10,10,10],rg:"8–10",rest:75,sug:25,tag:"Carga total com a barra"},
    {id:"martelo",r:[12,12,12],rg:"10–12",rest:60,h:1,sug:12}]},
  B:{n:"Treino B",s:"Peito + ombro + tríceps",warm:"Mobilidade de ombro + 2 séries leves no supino. Pegada neutra sempre que der.",ex:[
    {id:"supm",r:[8,8,8,8],rg:"6–8",rest:150,sug:80,tag:"Principal do dia. Punho reto, sem dobrar para trás."},
    {id:"supart",r:[10,10,10],rg:"8–10",rest:90,sug:60,tag:"Sem a articulada: supino inclinado no smith ou com halteres"},
    {id:"cross",r:[15,15,15],rg:"12–15",rest:60,sug:17.5},
    {id:"desm",r:[10,10,10],rg:"8–10",rest:90,sug:30},
    {id:"ella",r:[15,15,15,15],rg:"12–15",rest:60,h:1,sug:10,tag:"Prioridade do shape: controle a descida"},
    {id:"tricorda",r:[12,12,12],rg:"10–12",rest:60,sug:25},
    {id:"testa",r:[12,12,12],rg:"10–12",rest:60,sug:27.5}]},
  C:{n:"Treino C",s:"Upper body · foco peito, ombro e braços",warm:"Mobilidade de ombro + 1 série leve no supino.",ex:[
    {id:"supi",r:[12,12,12],rg:"10–12",rest:90,h:1,sug:18,tag:"Pegada neutra, palmas uma de frente para a outra"},
    {id:"peck",r:[15,15,15],rg:"12–15",rest:60,sug:45},
    {id:"puxtri",r:[12,12,12],rg:"10–12",rest:90,sug:50},
    {id:"remu",r:[12,12],rg:"10–12",rest:75,sug:22,tag:"Use strap se o pulso reclamar"},
    {id:"ella",r:[15,15,15],rg:"12–15",rest:60,h:1,sug:10},
    {id:"roscaw",r:[12,12,12],rg:"10–12",rest:0,sug:22,tag:"Bi-set: emende com o tríceps corda"},
    {id:"tricorda",r:[12,12,12],rg:"10–12",rest:60,sug:22,tag:"Bi-set"}]},
  D:{n:"Treino D",s:"Inferiores + corrida",warm:"5 min de bike leve + 2 séries leves no primeiro exercício. A corrida 1:1 vem depois.",ex:[
    {id:"hack",r:[8,8,8],rg:"6–8",rest:150,sug:100,tag:"Sem hack na sua unidade: agachamento no smith"},
    {id:"lp45",r:[12,12,12],rg:"10–12",rest:120,sug:200},
    {id:"thrust",r:[10,10,10],rg:"8–10",rest:90,sug:60,tag:"No smith ou na máquina de glúteo. As mãos só estabilizam."},
    {id:"mesa",r:[12,12,12],rg:"10–12",rest:75,sug:40,tag:"Sem mesa: cadeira flexora"},
    {id:"ext",r:[15,15,15],rg:"12–15",rest:60,sug:75},
    {id:"abd",r:[15,15],rg:"12–15",rest:45,sug:85},
    {id:"pantlp",r:[15,15,15],rg:"12–15",rest:45,sug:120}]},
  R1:{n:"Corrida 1:3",s:"7× (30s rápido + 90s leve)",run:[30,90]},
  R2:{n:"Corrida 1:2",s:"7× (45s rápido + 90s leve)",run:[45,90]},
  R3:{n:"Corrida 1:1",s:"7× (1 min rápido + 1 min leve)",run:[60,60]}
};
const DAYS={1:["A"],2:["R1"],3:["B"],4:["R2"],5:["C"],6:["D","R3"],0:[]};
const DN=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DFULL=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ds(new Date());
const br=s=>{const[y,m,d]=s.split("-");return d+"/"+m};
const fmt=n=>Number(n).toLocaleString("pt-BR",{maximumFractionDigits:1});
const mmss=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+pad(s%60)};
const isRun=id=>!!W[id].run;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("show"),2600)}
let ac;function beep(f=880,d=.18){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.25,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}try{navigator.vibrate&&navigator.vibrate(250)}catch(e){}}

/* ---------- dados ---------- */
const LS="th_logs_v1";let logs={};
const S={col:null,cloud:false,chain:{},timers:{}};
function lsLoad(){try{logs=JSON.parse(localStorage.getItem(LS)||"{}")||{}}catch(e){logs={}}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(logs))}catch(e){}}
function save(id){
  logs[id].upd=Date.now();lsSave();
  if(!S.col)return;
  clearTimeout(S.timers[id]);
  S.timers[id]=setTimeout(()=>{
    const data=JSON.parse(JSON.stringify(logs[id]));
    S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>S.col.doc(id).set(data)).catch(()=>{});
  },700);
}
function remove(id){delete logs[id];lsSave();if(S.col){S.chain[id]=(S.chain[id]||Promise.resolve()).then(()=>S.col.doc(id).delete()).catch(()=>{})}}
async function cloudInit(){
  if(!window.claude||!window.claude.use)return;
  try{
    const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    S.col=db.collection("data/users/"+uid);
    const snap=await S.col.get();const seen=new Set();
    snap.docs.forEach(d=>{const v=d.data();if(!v||!v.id)return;seen.add(d.id);if(!logs[v.id]||(v.upd||0)>=(logs[v.id].upd||0))logs[v.id]=v;else save(v.id)});
    Object.keys(logs).forEach(k=>{if(!seen.has(k))save(k)});
    lsSave();S.cloud=true;
    if(view.name!=="workout"&&view.name!=="run")render();else{const e=$("#sync");if(e)e.textContent="☁︎ salvo"}
  }catch(e){}
}
function getLog(wid,date){
  const id=date+"_"+wid;
  if(!logs[id])logs[id]={id,date,w:wid,sets:{},done:false,upd:0};
  return logs[id];
}
function hasData(l){if(!l)return false;if(l.done)return true;return Object.values(l.sets||{}).some(a=>a.some(s=>s&&s.ok))}
function prevSets(exId,beforeId){
  const arr=Object.values(logs).filter(l=>l.id!==beforeId&&l.sets&&l.sets[exId]&&l.sets[exId].some(s=>s&&s.ok)).sort((a,b)=>b.date.localeCompare(a.date)||(b.upd-a.upd));
  return arr[0]?arr[0].sets[exId]:null;
}
function lastDone(wid){const a=Object.values(logs).filter(l=>l.w===wid&&hasData(l)).sort((a,b)=>b.date.localeCompare(a.date));return a[0]?a[0].date:null}

/* ---------- estado de tela ---------- */
let view={name:"home"};let cur=null;
function go(v){view=v;render();window.scrollTo(0,0)}

/* ---------- render ---------- */
function render(){
  $("#tabHome").classList.toggle("on",view.name!=="history"&&view.name!=="exercise");
  $("#tabHist").classList.toggle("on",view.name==="history"||view.name==="exercise");
  const app=$("#app");
  if(view.name==="home")app.innerHTML=home();
  else if(view.name==="workout")app.innerHTML=workout();
  else if(view.name==="run"){app.innerHTML=runView();runPaint()}
  else if(view.name==="history")app.innerHTML=history();
  else if(view.name==="exercise")app.innerHTML=exDetail();
}
function hdr(title,sub,back){
  return `<div class="top">${back?`<button class="back" data-act="${back}" aria-label="Voltar">‹</button>`:""}<h1>${title}${sub?`<span class="sub">${sub}</span>`:""}</h1><span class="sync" id="sync">${S.cloud?"☁︎ salvo":""}</span></div>`;
}
function home(){
  const now=new Date(),dow=now.getDay(),t=today();
  const mon=new Date(now);mon.setDate(now.getDate()-((dow+6)%7));
  let week="";
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);const k=ds(d),wd=d.getDay();
    const plan=DAYS[wd];const done=plan.length&&plan.every(w=>hasData(logs[k+"_"+w]));
    const lab=plan.length?plan.map(w=>isRun(w)?"🏃":w).join(""):"–";
    week+=`<div class="day${k===t?" today":""}${done?" done":""}"><b>${DN[wd]}</b><span>${lab}</span></div>`;
  }
  const plan=DAYS[dow];
  let card=`<div class="today-card"><h2 style="font-size:30px">Hoje, ${DFULL[dow]} ${br(t)}</h2>`;
  if(!plan.length)card+=`<p>Dia de descanso. Amanhã tem Treino A.</p>`;
  else{
    card+=`<p>${plan.length>1?"Musculação primeiro, corrida depois.":"Bora."}</p>`;
    plan.forEach(w=>{const ok=hasData(logs[t+"_"+w]);card+=`<button class="go${ok?" ok":""}" data-act="open" data-v="${w}"><span><strong>${W[w].n}</strong><small>${ok?"Feito ✓ toque para revisar":W[w].s}</small></span><span style="font-size:26px">›</span></button>`});
  }
  card+=`</div>`;
  let list="";
  ["A","B","C","D","R1","R2","R3"].forEach(w=>{
    const ld=lastDone(w);
    list+=`<button class="item" data-act="open" data-v="${w}"><span class="letter${isRun(w)?" run":""}">${isRun(w)?W[w].n.slice(-3):w}</span><div><strong>${W[w].n} <span style="color:var(--muted);font-weight:400">${W[w].s}</span></strong><small>${ld?"Última vez: "+br(ld):"Ainda não feito"}</small></div><span>›</span></button>`;
  });
  return hdr("TURUGYM")+`<main><div class="week">${week}</div>${card}<h2 class="section-title">Todos os treinos</h2><div class="list">${list}</div></main>`;
}
function workout(){
  const w=W[cur.w],l=cur;
  let h=hdr(w.n,w.s+" · "+br(l.date),"home")+`<main>`;
  if(w.warm)h+=`<p class="note">${w.warm}<br><b>Progressão:</b> bateu o topo da faixa em todas as séries? Suba 2,5–5 kg no próximo treino.</p>`;
  w.ex.forEach((e,ei)=>{
    const ex=EX[e.id],t=ex.t||"kg",sets=l.sets[e.id]||[],prev=prevSets(e.id,l.id);
    const restTxt=e.rest?(e.rest>=60&&e.rest%60===0?e.rest/60+" min":e.rest+"s"):"sem descanso";
    const nums=e.rg?e.r.length+"×"+e.rg:(e.r.every(x=>x===e.r[0])?e.r.length+"×"+e.r[0]:e.r.join("-"));
    h+=`<section class="ex"><div class="ex-head"><h3>${ex.n}</h3><span class="meta">${nums} · ${restTxt}</span></div>`;
    if(e.tag)h+=`<div class="tag">${e.tag}</div>`;
    const cls=t==="kg"?"grid":t==="bw"?"grid nokg":"grid time";
    h+=`<div class="${cls}"><span class="gh">Série</span><span class="gh l">Anterior</span>${t==="kg"?`<span class="gh">${e.h?"kg cada":"kg"}</span>`:""}${t!=="time"?'<span class="gh">Reps</span>':""}<span class="gh">✓</span></div>`;
    e.r.forEach((target,si)=>{
      const s=sets[si]||{},p=prev&&prev[si]&&prev[si].ok?prev[si]:null;
      const sg=e.sug!=null?(Array.isArray(e.sug)?e.sug[si]:e.sug):null;
      const prevTxt=p?(t==="kg"?fmt(p.kg||0)+" × "+p.reps:t==="bw"?p.reps+" reps":"feito"):(sg!=null&&t==="kg"?"sugerido":"—");
      const repPh=p&&p.reps!=null?p.reps:target;
      h+=`<div class="${cls}${s.ok?" row-done":""}"><span class="n">${si+1}</span><span class="prev">${prevTxt}</span>`;
      if(t==="kg")h+=`<input inputmode="decimal" aria-label="Carga série ${si+1}" data-in="kg" data-e="${ei}" data-s="${si}" value="${s.kg??""}" placeholder="${p&&p.kg!=null?fmt(p.kg):sg!=null?fmt(sg):"kg"}">`;
      if(t!=="time")h+=`<input inputmode="numeric" aria-label="Repetições série ${si+1}" data-in="reps" data-e="${ei}" data-s="${si}" value="${s.reps??""}" placeholder="${repPh}">`;
      if(t==="time")h=h.replace(/<span class="prev">([^<]*)<\/span>$/,`<span class="prev">${target}${p?" · feito antes":""}</span>`);
      h+=`<button class="chk${s.ok?" on":""}" data-act="chk" data-e="${ei}" data-s="${si}" aria-label="Concluir série ${si+1}">✓</button></div>`;
    });
    h+=`</section>`;
  });
  h+=`<button class="btn" data-act="finish">${l.done?"Salvar alterações":"Finalizar treino"}</button>`;
  if(hasData(l))h+=`<button class="btn danger" data-act="del">Apagar este treino</button>`;
  return h+`</main>`;
}

/* ---------- corrida ---------- */
let R=null;
function phases(w){
  const[f,s]=W[w].run;const p=[{z:1,d:300,l:"Aquecimento leve"}];
  for(let i=1;i<=7;i++){p.push({z:3,d:f,l:"Rápido",k:i});p.push({z:1,d:s,l:"Leve",k:i})}
  p.push({z:1,d:300,l:"Desaquecimento leve"});return p;
}
function runView(){
  const w=W[cur.w],l=cur;
  if(!R||R.w!==cur.w||R.date!==l.date)R={w:cur.w,date:l.date,ph:phases(cur.w),i:0,left:300,end:0,on:false};
  const total=R.ph.reduce((a,p)=>a+p.d,0);
  let steps="";R.ph.forEach((p,i)=>{steps+=`<i class="${p.z===3?"z3":""}${i<R.i?" past":""}${i===R.i?" cur":""}" style="flex:${p.d}"></i>`});
  const feel=["Fácil","Ok","Pesado"].map(f=>`<button class="${l.feel===f?"on":""}" data-act="feel" data-v="${f}">${f}</button>`).join("");
  return hdr(w.n,w.s+" · "+br(l.date),"home")+`<main>
  <p class="note">Faça o aquecimento dinâmico antes. Rápido = Z3 (70–79% FCmáx, conversa com dificuldade). Leve = Z1 (dá pra conversar).</p>
  <div class="phase" id="ph"><div class="label" id="phL"></div><div class="clock" id="phC">5:00</div><div class="next" id="phN"></div></div>
  <div class="steps" id="steps">${steps}</div>
  <div class="row2"><button class="btn" data-act="run-toggle" id="runBtn">Começar</button><button class="btn ghost" data-act="run-skip">Pular etapa</button></div>
  <p style="color:var(--muted);font-size:14px;text-align:center;margin:10px 0 18px">Total: ${Math.round(total/60)} min. O app apita e vibra a cada troca.</p>
  <h2 class="section-title">Como foi?</h2><div class="feel">${feel}</div>
  <button class="btn" data-act="run-done">${l.done?"Corrida registrada ✓":"Marcar corrida como feita"}</button>
  ${hasData(l)?'<button class="btn danger" data-act="del">Apagar este registro</button>':""}
  </main>`;
}
function runPaint(){
  if(!R||view.name!=="run")return;
  const p=R.ph[R.i],left=R.on?(R.end-Date.now())/1000:R.left;
  const ph=$("#ph");if(!ph)return;
  ph.classList.toggle("z3",!!p&&p.z===3);
  if(!p){$("#phL").textContent="Corrida concluída";$("#phC").textContent="✓";$("#phN").textContent="Toque em marcar como feita.";$("#runBtn").textContent="Recomeçar";return}
  $("#phL").textContent=p.l+(p.k?` · tiro ${p.k}/7`:"")+(p.z===3?" · Z3":" · Z1");
  $("#phC").textContent=mmss(left);
  const n=R.ph[R.i+1];$("#phN").textContent=n?"Depois: "+n.l.toLowerCase()+" "+mmss(n.d):"Última etapa";
  $("#runBtn").textContent=R.on?"Pausar":(R.i===0&&R.left===R.ph[0].d?"Começar":"Continuar");
  document.querySelectorAll("#steps i").forEach((el,i)=>{el.classList.toggle("past",i<R.i);el.classList.toggle("cur",i===R.i)});
}
let wake=null;
async function wakeOn(){try{if(navigator.wakeLock&&!wake)wake=await navigator.wakeLock.request("screen")}catch(e){}}
function wakeOff(){try{wake&&wake.release()}catch(e){}wake=null}
function runAdvance(){
  R.i++;
  if(R.i>=R.ph.length){R.on=false;beep(660,.5);wakeOff();cur.done=true;save(cur.id);toast("Corrida concluída e salva");render();return}
  const p=R.ph[R.i];R.end=Date.now()+p.d*1000;R.left=p.d;beep(p.z===3?990:520,.3);
}

/* ---------- descanso ---------- */
let rest={end:0,total:0};
function startRest(s){if(!s)return;rest.total=s;rest.end=Date.now()+s*1000;$("#rest").classList.add("show");paintRest()}
function paintRest(){const left=(rest.end-Date.now())/1000;$("#restT").innerHTML=mmss(left)+"<small>Descanso</small>"}
function stopRest(){rest.end=0;$("#rest").classList.remove("show")}

setInterval(()=>{
  if(rest.end){if(Date.now()>=rest.end){stopRest();beep(880,.35)}else paintRest()}
  if(R&&R.on){if(Date.now()>=R.end)runAdvance();runPaint()}
},250);

/* ---------- histórico ---------- */
function history(){
  const map={};
  Object.values(logs).forEach(l=>{if(isRun(l.w))return;Object.entries(l.sets||{}).forEach(([k,a])=>{if(a.some(s=>s&&s.ok)){(map[k]=map[k]||[]).push(l)}})});
  const keys=Object.keys(map).sort((a,b)=>EX[a].n.localeCompare(EX[b].n));
  const runs=Object.values(logs).filter(l=>isRun(l.w)&&hasData(l)).sort((a,b)=>b.date.localeCompare(a.date));
  let h=hdr("Histórico","Toque num exercício para ver a evolução")+`<main>`;
  if(!keys.length&&!runs.length)return h+`<p class="empty">Nada registrado ainda. Conclua uma série no treino de hoje e ela aparece aqui.</p></main>`;
  if(keys.length){h+=`<h2 class="section-title">Exercícios</h2><div class="list">`;
    keys.forEach(k=>{const ls=map[k].sort((a,b)=>b.date.localeCompare(a.date));const best=bestOf(k);
      h+=`<button class="item" data-act="exd" data-v="${k}"><div><strong>${EX[k].n}</strong><small>${ls.length} ${ls.length>1?"treinos":"treino"} · último ${br(ls[0].date)}${best?" · melhor "+best:""}</small></div><span>›</span></button>`});
    h+=`</div>`}
  if(runs.length){h+=`<h2 class="section-title" style="margin-top:20px">Corridas</h2>`;
    runs.forEach(l=>{h+=`<div class="hist-row"><strong>${br(l.date)} · ${W[l.w].n}</strong><div class="sets">${W[l.w].s}${l.feel?" · "+l.feel:""}</div></div>`})}
  h+=`<button class="btn danger" style="margin-top:24px" data-act="wipe">Apagar todo o histórico</button>`;
  return h+`</main>`;
}
function sessVal(k,sets){const t=EX[k].t||"kg";const ok=sets.filter(s=>s&&s.ok);if(!ok.length)return null;
  if(t==="kg")return Math.max(...ok.map(s=>+s.kg||0));if(t==="bw")return ok.reduce((a,s)=>a+(+s.reps||0),0);return ok.length}
function bestOf(k){const t=EX[k].t||"kg";let b=null;Object.values(logs).forEach(l=>{const a=l.sets&&l.sets[k];if(!a)return;a.forEach(s=>{if(!s||!s.ok)return;if(t==="kg"){if(b===null||(+s.kg||0)>b.kg||((+s.kg||0)===b.kg&&+s.reps>b.reps))b={kg:+s.kg||0,reps:+s.reps||0}}})});return b?fmt(b.kg)+" kg × "+b.reps:""}
function exDetail(){
  const k=view.id,ex=EX[k],t=ex.t||"kg";
  const ls=Object.values(logs).filter(l=>l.sets&&l.sets[k]&&l.sets[k].some(s=>s&&s.ok)).sort((a,b)=>a.date.localeCompare(b.date));
  const pts=ls.map(l=>({d:l.date,v:sessVal(k,l.sets[k])}));
  const unit=t==="kg"?"Carga máxima (kg)":t==="bw"?"Total de repetições":"Séries feitas";
  let h=hdr(ex.n,unit+" por treino","tab-history")+`<main>`;
  if(pts.length){
    const W0=320,H0=150,px=28,py=18,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),rg=mx-mn||1;
    const X=i=>pts.length===1?W0/2:px+i*(W0-2*px)/(pts.length-1),Y=v=>H0-py-(v-mn)/rg*(H0-2*py)+(mx===mn?-(H0/2-py):0);
    const line=pts.map((p,i)=>X(i).toFixed(1)+","+Y(p.v).toFixed(1)).join(" ");
    let svg=`<svg viewBox="0 0 ${W0} ${H0+20}" role="img" aria-label="Evolução de ${ex.n}"><polyline points="${line}" fill="none" stroke="var(--pri-text)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p,i)=>{svg+=`<circle cx="${X(i)}" cy="${Y(p.v)}" r="5" fill="var(--pri-text)"/>`;
      if(pts.length<=8||i===0||i===pts.length-1)svg+=`<text x="${X(i)}" y="${Y(p.v)-10}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${fmt(p.v)}</text><text x="${X(i)}" y="${H0+14}" text-anchor="middle" font-size="11" fill="var(--muted)">${br(p.d)}</text>`});
    svg+=`</svg>`;
    const diff=pts.length>1?pts[pts.length-1].v-pts[0].v:0;
    h+=`<div class="chart">${svg}${pts.length>1?`<p style="margin:6px 0 0;color:var(--muted);font-size:14px">${diff>0?"+":""}${fmt(diff)} desde ${br(pts[0].d)}</p>`:""}</div>`;
  }
  ls.slice().reverse().forEach(l=>{
    const ok=l.sets[k].filter(s=>s&&s.ok);
    const txt=ok.map(s=>t==="kg"?fmt(s.kg||0)+"×"+s.reps:t==="bw"?s.reps:"✓").join("  ");
    const vol=t==="kg"?ok.reduce((a,s)=>a+(+s.kg||0)*(+s.reps||0),0):0;
    h+=`<div class="hist-row"><strong>${br(l.date)} · ${W[l.w].n}</strong><div class="sets">${txt}${vol?`  ·  volume ${fmt(vol)} kg`:""}</div></div>`;
  });
  return h+`</main>`;
}

/* ---------- eventos ---------- */
document.addEventListener("input",e=>{
  const el=e.target;if(!el.dataset||!el.dataset.in||!cur)return;
  const ex=W[cur.w].ex[+el.dataset.e],si=+el.dataset.s;
  const a=cur.sets[ex.id]=cur.sets[ex.id]||[];a[si]=a[si]||{};
  const v=el.value.replace(",",".");a[si][el.dataset.in]=v===""?null:+v;
  if(a[si].ok)save(cur.id);
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,v=b.dataset.v;
  if(act==="tab"){go({name:v});return}
  if(act==="home"){R&&R.on&&(R.on=false,R.left=(R.end-Date.now())/1000);wakeOff();go({name:"home"});return}
  if(act==="tab-history"){go({name:"history"});return}
  if(act==="open"){cur=getLog(v,today());go({name:isRun(v)?"run":"workout"});return}
  if(act==="exd"){go({name:"exercise",id:v});return}
  if(act==="chk"){
    const ex=W[cur.w].ex[+b.dataset.e],si=+b.dataset.s,t=EX[ex.id].t||"kg";
    const a=cur.sets[ex.id]=cur.sets[ex.id]||[];const s=a[si]=a[si]||{};
    if(s.ok){s.ok=false;save(cur.id);render();return}
    const row=b.parentElement,kgI=row.querySelector('[data-in="kg"]'),rI=row.querySelector('[data-in="reps"]');
    if(kgI&&(s.kg==null||s.kg==="")){const ph=parseFloat((kgI.placeholder||"").replace(",","."));s.kg=isNaN(ph)?0:ph}
    if(rI&&(s.reps==null||s.reps==="")){const ph=parseInt(rI.placeholder,10);s.reps=isNaN(ph)?0:ph}
    s.ok=true;save(cur.id);beep(1200,.06);
    const isLast=si===ex.r.length-1;
    render();if(ex.rest)startRest(ex.rest);
    if(isLast&&!ex.rest)stopRest();
    return;
  }
  if(act==="finish"){
    if(!hasData(cur)){toast("Conclua pelo menos uma série antes de finalizar");return}
    cur.done=true;save(cur.id);stopRest();
    let n=0,vol=0;Object.entries(cur.sets).forEach(([k,a])=>a.forEach(s=>{if(s&&s.ok){n++;vol+=(+s.kg||0)*(+s.reps||0)}}));
    toast(`${W[cur.w].n} salvo: ${n} séries${vol?", "+fmt(vol)+" kg de volume":""}`);
    const sat=new Date().getDay()===6&&cur.w==="D";
    if(sat){cur=getLog("R3",today());go({name:"run"})}else go({name:"home"});
    return;
  }
  if(act==="del"){if(!confirm("Apagar o registro de "+W[cur.w].n+" de "+br(cur.date)+"?"))return;remove(cur.id);R=null;toast("Registro apagado");go({name:"home"});return}
  if(act==="wipe"){if(!confirm("Apagar todo o histórico? Isso não pode ser desfeito."))return;Object.keys(logs).forEach(remove);toast("Histórico apagado");go({name:"history"});return}
  if(act==="rest-add"){rest.end+=(+v)*1000;if(rest.end<=Date.now())stopRest();else paintRest();return}
  if(act==="rest-skip"){stopRest();return}
  if(act==="run-toggle"){
    if(R.i>=R.ph.length){R=null;render();return}
    if(R.on){R.on=false;R.left=(R.end-Date.now())/1000;wakeOff()}else{R.on=true;R.end=Date.now()+R.left*1000;beep(760,.2);wakeOn()}
    runPaint();return;
  }
  if(act==="run-skip"){if(R.i<R.ph.length){const was=R.on;runAdvance();if(R&&!was&&R.i<R.ph.length){R.left=R.ph[R.i].d}runPaint()}return}
  if(act==="feel"){cur.feel=v;save(cur.id);render();return}
  if(act==="run-done"){cur.done=true;save(cur.id);toast("Corrida registrada");render();return}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&R&&R.on)wakeOn()});

lsLoad();render();cloudInit();
</script>
